name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: bash build-deb.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: build/*.deb